<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">เข้าสู่ระบบ Internship & Job Board</h2>
    
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm">
      {{ errorMessage }}
    </div>

    <form (submit)="onLogin(); $event.preventDefault()">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">อีเมล (Email)</label>
        <input type="email" [(ngModel)]="email" name="email" required
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              placeholder="name@example.com">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">รหัสผ่าน (Password)</label>
        <input type="password" [(ngModel)]="password" name="password" required
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              placeholder="********">
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-200">
        เข้าสู่ระบบ
      </button>
    </form>
  </div>
</div>
